<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Focus Flow</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>Focus Flow</h1>
      <div class="mode-switch" id="modeSwitch">
        <button class="mode-btn active" data-mode="focus">Focus</button>
        <button class="mode-btn" data-mode="short">Short Break</button>
        <button class="mode-btn" data-mode="long">Long Break</button>
      </div>
    </header>

    <main class="main">
      <section class="timer-card">
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 220 220">
            <circle class="ring-bg" cx="110" cy="110" r="100" />
            <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="100" />
          </svg>
          <div class="ring-center">
            <div class="time" id="timeDisplay">25:00</div>
            <div class="current-task" id="currentTaskLabel">No task selected</div>
          </div>
        </div>

        <div class="controls">
          <button class="ctrl-btn secondary" id="resetBtn" title="Reset">&#8635;</button>
          <button class="ctrl-btn primary" id="startPauseBtn">Start</button>
          <button class="ctrl-btn secondary" id="skipBtn" title="Skip">&#9197;</button>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="stat-num" id="sessionsToday">0</span>
            <span class="stat-label">sessions today</span>
          </div>
          <div class="stat">
            <span class="stat-num" id="focusMinutesToday">0</span>
            <span class="stat-label">focus minutes</span>
          </div>
          <div class="stat">
            <span class="stat-num" id="streakCount">0</span>
            <span class="stat-label">day streak</span>
          </div>
        </div>
      </section>

      <section class="task-card">
        <div class="task-header">
          <h2>Tasks</h2>
          <span class="task-count" id="taskCount">0 tasks</span>
        </div>
        <form id="taskForm" class="task-form">
          <input type="text" id="taskInput" placeholder="What are you working on?" autocomplete="off" />
          <button type="submit">Add</button>
        </form>
        <ul class="task-list" id="taskList"></ul>
        <p class="empty-hint" id="emptyHint">Add a task, then click it to make it active.</p>
      </section>
    </main>

    <footer class="settings">
      <div class="setting">
        <label for="focusLen">Focus</label>
        <input type="number" id="focusLen" min="1" max="90" value="25" /> min
      </div>
      <div class="setting">
        <label for="shortLen">Short break</label>
        <input type="number" id="shortLen" min="1" max="30" value="5" /> min
      </div>
      <div class="setting">
        <label for="longLen">Long break</label>
        <input type="number" id="longLen" min="1" max="60" value="15" /> min
      </div>
      <button class="ghost-btn" id="clearHistoryBtn">Clear history</button>
    </footer>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
